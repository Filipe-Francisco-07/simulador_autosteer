; Firmware de bancada: o tradutor de producao rodando no ESP32, com o motor
; Keya entrando pela USB em vez do barramento CAN.
;
; O codigo da traducao NAO e copiado — vem do repo AgroPreciso por include.
; Se o Pedro mexer no firmware, o proximo build ja pega.
;
;   pio run -e bancada -t upload --upload-port COM3

[env:bancada]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 38400
upload_speed = 115200
build_src_filter = +<bancada.cpp>
build_flags =
    -I ../../AgroPreciso/AgroPreciso/firmware/autosteer_can_esp32/src
    -Wno-date-time
